app = "agua-gdl-api"
primary_region = "iad"
# Room for an in-flight reminder (15 s HTTP timeout) to finish and be recorded on shutdown.
kill_timeout = "30s"

[build]
  dockerfile = "infra/Dockerfile"

[env]
  PORT = "8080"
  REMINDER_HOUR = "20"
  DAILY_CAP = "250"
  MONTHLY_CAP = "5000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
