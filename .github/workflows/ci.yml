name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aguagdl_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aguagdl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aguagdl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aguagdl_test:test@localhost:5432/aguagdl_test?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go vet ./...
      - run: go test -race ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile .
