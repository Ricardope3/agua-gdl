name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 13 * * 1"  # Mondays, so new Go or pgx vulnerabilities surface while the repo is quiet
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aguagdl_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aguagdl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aguagdl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aguagdl_test:test@localhost:5432/aguagdl_test?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: api/go.mod
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f infra/Dockerfile .
